services:
  mcp-server:
    image: jiucai233/ybigta_newbie_team_project:latest
    container_name: ubuntu-mcp-server-1
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8000
    volumes:
      - ./database:/app/database
    command: uvicorn mcp_server:mcp.sse_app --host 0.0.0.0 --port 8000
    restart: always

  ybigta-agent:
    image: jiucai233/ybigta_newbie_team_project:latest
    container_name: ubuntu-ybigta-agent-1
    ports:
      - "8501:8501" 
    env_file: .env
    environment:
      - MCP_HOST=mcp-server
    volumes:
      - ./database:/app/database
      - ./st_app/db:/app/st_app/db
    command: streamlit run streamlit_app.py --server.port 8501 --server.address 0.0.0.0
    depends_on:
      - mcp-server
    restart: always